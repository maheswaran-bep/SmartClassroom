services:

  mysql:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: smartclassroom-mysql:latest
    container_name: smartclassroom-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_class
      MYSQL_USER: smartclass_user
      MYSQL_PASSWORD: smartclass_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword"
        ]
      interval: 10s
      timeout: 5s
      retries: 15

    networks:
      - smartclassroom


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smartclassroom-backend:latest
    container_name: smartclassroom-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: smartclass_user
      DB_PASSWORD: smartclass_password
      DB_NAME: smart_class

      JWT_SECRET: change-this-to-a-long-random-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440

      CORS_ORIGINS: http://localhost

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_NAME: SmartClassroom-UCJ

      ASSIGNMENT_QUESTIONS_DIR: storage/assignment_questions
      STUDENT_SUBMISSIONS_DIR: storage/student_submissions

    volumes:
      - smartclassroom_storage:/app/storage

    expose:
      - "8000"

    networks:
      - smartclassroom


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: smartclassroom-frontend:latest
    container_name: smartclassroom-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - smartclassroom


volumes:
  mysql_data:
  smartclassroom_storage:


networks:
  smartclassroom:
    driver: bridge